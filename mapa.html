<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda del Tesoro - Mapa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --parchment-bg: #e8dcc4;
            --parchment-border: #3e2723;
            --text-dark: #3e2723;
            --btn-bg: #5d4037;
            --btn-hover: #795548;
            --red-pawn: #e53935;
            --blue-pawn: #1e88e5;
            --green-pawn: #43a047;
            --glow-color: rgba(255, 0, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'MedievalSharp', cursive;
            background-color: #2c2c2c;
            color: var(--text-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Main Container --- */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Start Button --- */
        #start-btn-container {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--parchment-bg);
            padding: 40px;
            border: 4px solid var(--parchment-border);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .pirate-btn {
            font-family: 'MedievalSharp', cursive;
            font-size: 2rem;
            padding: 15px 40px;
            background-color: var(--btn-bg);
            color: #fff;
            border: 2px solid #2d1a11;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #2d1a11, 0 8px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .pirate-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(2px);
            box-shadow: 0 3px 0 #2d1a11, 0 5px 10px rgba(0,0,0,0.5);
        }
        
        .pirate-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #2d1a11;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1rem;
            padding: 8px 15px;
            z-index: 100;
        }

        /* --- Map Canvas (SVG) --- */
        #map-svg {
            width: 100%;
            height: 100%;
            max-height: 800px;
            background-color: var(--parchment-border); /* Borde café oscuro */
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 5px;
            position: relative;
        }

        .dotted-path {
            fill: none;
            stroke: #5d4037;
            stroke-width: 3;
            stroke-dasharray: 8, 8;
            opacity: 0.8;
        }

        /* Nivel Markers */
        .level-marker {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .level-marker circle.base {
            fill: #d7ccc8; /* Inactivo */
            stroke: #5d4037;
            stroke-width: 3;
            transition: all 0.3s ease;
        }

        .level-marker:hover circle.base, .level-marker.active-hover circle.base {
            fill: #ff3b30;
            filter: drop-shadow(0 0 15px var(--glow-color));
        }

        .level-marker.completed circle.base {
            fill: #ffca28; /* Dorado */
        }

        /* Peones */
        .pawn-group {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; 
            pointer-events: none;
        }
        
        .pawn-group.visible {
            opacity: 1;
        }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--parchment-bg);
            border: 5px solid var(--parchment-border);
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            box-shadow: inset 0 0 30px rgba(139, 90, 43, 0.3), 0 10px 40px rgba(0,0,0,0.9);
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: bold;
        }

        .modal-title {
            font-size: 1.8rem;
            margin-top: 0;
            border-bottom: 2px solid var(--parchment-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .pwd-input {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            font-family: 'MedievalSharp', cursive;
            border: 2px solid var(--parchment-border);
            background: rgba(255,255,255,0.7);
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
        }

        .error-msg {
            color: #d32f2f;
            display: none;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .instruction-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 15px;
        }
        
        /* Estilo para el scrollbar para que parezca pergamino */
        .instruction-text::-webkit-scrollbar {
            width: 8px;
        }
        .instruction-text::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        .instruction-text::-webkit-scrollbar-thumb {
            background: var(--parchment-border);
            border-radius: 4px;
        }

        .links-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .link-btn { text-decoration: none; display: inline-block; font-size: 1rem; padding: 10px 20px; }
    </style>
</head>
<body>

    <button class="pirate-btn back-btn" onclick="window.location.href='index.html'">⬅ Volver</button>

    <main class="game-container">
        
        <div id="start-btn-container">
            <button class="pirate-btn" id="btn-start">⚓ Comenzar la Aventura</button>
        </div>

        <svg id="map-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">

            <!-- Fondo pergamino rasgado -->
            <path d="M 40,40 Q 60,30 80,40 T 150,30 T 250,50 T 400,20 T 600,40 T 800,20 T 1000,50 T 1160,40 
                     L 1160,760 Q 1140,750 1100,770 T 900,750 T 600,780 T 400,740 T 200,770 T 40,760 Z"

                <path d="M 0 -60 L 15 -15 L 60 0 L 15 15 L 0 60 L -15 15 L -60 0 L -15 -15 Z" fill="#8b5a2b"/>
                <text x="-7" y="-70" font-family="MedievalSharp" font-size="20" fill="#3e2723" stroke="none">N</text>

            <!-- Cerca de la iglesia (Removido) -->
            <!-- Por el continente -->

            <image href="arboles.png" x="350" y="450" height="55" width="55" preserveAspectRatio="xMidYMid meet" />
            <image href="arboles.png" x="700" y="350" height="45" width="45" preserveAspectRatio="xMidYMid meet" />

            <!-- Chozas (5 mínimas) -->

            <image href="chozas.png" x="480" y="500" height="40" width="40" preserveAspectRatio="xMidYMid meet" />
            <image href="chozas.png" x="700" y="250" height="45" width="45" preserveAspectRatio="xMidYMid meet" />
            <image href="chozas.png" x="200" y="650" height="50" width="50" preserveAspectRatio="xMidYMid meet" />




            <!-- RUTAS -->
            <path class="dotted-path" d="M 220,400 Q 300,300 400,380" />
            <path class="dotted-path" d="M 400,380 Q 500,450 600,300" />
            <path class="dotted-path" stroke="#1e88e5" d="M 600,300 Q 750,250 950,520" />
            <path class="dotted-path" d="M 950,520 Q 1000,300 900,200" />


            <!-- ICONOS PRINCIPALES (No interactivos) -->

            </g>

            <!-- 2. Búnker -->

                <image href="bunker.png" x="-40" y="-40" height="80" width="80" preserveAspectRatio="xMidYMid meet" />
            </g>

            <!-- 3. Iglesia -->
            <g transform="translate(580, 280)">

                <path d="M -6,-4 Q 0,-10 6,-4 M -4,6 Q 0,10 4,6" fill="none" stroke="#d32f2f" stroke-width="3"/>
                <circle cx="-6" cy="-2" r="2" fill="#d32f2f" stroke="none"/>

                <path d="M -30,20 Q -25,-10 -20,-30 M -20,-30 Q -40,-20 -50,-10 M -20,-30 Q -10,-40 0,-30 M -20,-30 Q -5,-20 10,-10" fill="none" stroke="#5d4037" stroke-width="4"/>

            <g class="level-marker" id="lvl-4" transform="translate(950, 520)" onclick="handleLevelClick(4)">

                    <circle cx="0" cy="-12" r="8" fill="var(--red-pawn)" stroke="#000" stroke-width="1"/>
                </g>
            </g>
        </svg>
    </main>

    <!-- Modales -->
    <div class="modal-overlay" id="pwd-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closePwdModal()">✖</span>

            <div class="error-msg" id="pwd-error">¡Contraseña incorrecta!</div>

            </div>
        </div>

    <script>
        const LEVEL_PASSWORDS = { 2: "humano o maquina", 3: "paz y bien", 4: "innoovar sin conexion", 5: "dominio total" };
        const LEVEL_INSTRUCTIONS = {
            1: { 
                title: "🏛️ Ubicación: Arena AI — Coliseo Romano", 
                links: [{ label: "🛠️ Herramienta del reto", url: "https://arena.ai" }],
                text: `<b>Bienvenidos a la arena.</b><br>Antes de competir, cada equipo deberá construir su identidad.<br><br>
                       <b>Objetivo</b><br>Crear un nombre de equipo relacionado con IA, tecnología o futuro, y un logo representativo usando Arena AI.<br><br>

                           <li>Todos los integrantes deben participar.</li>
                           <li>El logo debe ser original.</li>
                       </ul>
                       <br><i>Cuando terminen... Recibirán la primera bandera.</i>`

            2: { 
                title: "🛡️ Ubicación: Bunker Ex Machina", 
                links: [
                    { label: "▶️ Video 1", url: "https://www.youtube.com/watch?v=5G2h9fSc-5Q" },
                    { label: "▶️ Video Prueba de Turing", url: "https://www.youtube.com/watch?v=rF8d7XAuAaY" }
                ],
                text: `<b>¿Humano o Máquina?</b><br>
                       <i>Inspirado en la Prueba de Turing</i><br><br>
                       Una inteligencia artificial se ha infiltrado entre ustedes. Su misión será descubrir quién es… antes de que sea demasiado tarde.<br><br>
                       <b>Cómo funciona</b><br>
                       Participan 3 estudiantes:
                       <ul>
                           <li><b>Investigador:</b> Hace las preguntas</li>
                           <li><b>Participante A:</b> Puede ser humano o IA</li>
                           <li><b>Participante B:</b> Puede ser humano o IA</li>
                       </ul>
                       <i>El investigador NO sabe quién es quién.</i><br><br>
                       <b>Preparación secreta (Antes de empezar)</b><br>
                       A uno de los participantes se le entrega una tarjeta secreta que dice <b>"SOY IA"</b>. Ese estudiante deberá responder:
                       <ul>
                           <li>De forma lógica y correcta.</li>
                           <li>Algo "perfecta" y ligeramente fría.</li>
                           <li>Usando el pequeño guion entregado.</li>
                       </ul>

                           <li>Reaccionando de forma emocional o espontánea.</li>
                       </ul>
                       <b>Objetivo del investigador</b><br>

                       <i>¿Quién está actuando como inteligencia artificial?</i>`
            },

                title: "⛪ Ubicación: Archivo Seráfico",

                    { label: "🛠️ Herramienta del reto", url: "https://notebooklm.google.com" },
                    { label: "📄 Historia del Seráfico", url: "colegioserafico.pdf" }

                text: `<b>Toda institución guarda secretos en su historia. El conocimiento será la clave.</b><br><br>

                       <b>Reglas</b>

                           <li>No se permite modificar el archivo.</li>

                       </ul>
                       <b>Pista</b><br><i>“La respuesta siempre ha estado en la historia.”</i><br><br>
                       <i>Cuando terminen... Recibirán la tercera bandera.</i>`
            },
            4: { 
                title: "🏐 Ubicación: Isla Sin Red", 
                links: [],
                text: `<b>La conexión ha desaparecido. No hay internet. No hay inteligencia artificial. Solo quedan ustedes y sus ideas.</b><br><br>
                       <b>Objetivo</b><br>Diseñar una solución real usando IA para mejorar: el país, el colegio, o la vida cotidiana.<br><br>
                       <b>Instrucciones</b>
                       <ul>
                           <li>No podrán usar: internet, celulares, IA, buscadores.</li>
                           <li>Cada equipo recibirá únicamente: papel, lápiz, y su creatividad.</li>
                           <li>Diseñen: el problema, la solución, cómo usarían IA, y su impacto.</li>

                       <b>Reglas</b>

                           <li>Todos deben participar en la propuesta.</li>
                       </ul>
                       <b>Pregunta clave</b><br><i>“¿Qué haría la humanidad si la tecnología desapareciera mañana?”</i><br><br>
                       <i>Cuando terminen... Recibirán la cuarta bandera.</i>`

                title: "🏴‍☠️ Kahoot Final — Todo el Taller", 
                links: [{ label: "🛠️ Herramienta del reto", url: "https://kahoot.it" }],
                text: `<b>Han llegado al desafío final. Todo lo aprendido será puesto a prueba.</b><br><br>
                       <b>Objetivo</b><br>Responder preguntas sobre: IA, creatividad, ética, herramientas, retos anteriores, y conocimientos vistos durante el taller.<br><br>
                       <b>Instrucciones</b>
                       <ul>
                           <li>Ingresen al Kahoot.</li>
                           <li>Respondan lo más rápido y preciso posible.</li>
                           <li>Cada pregunta suma puntos.</li>
                           <li>El equipo con mayor puntuación será el ganador final.</li>
                       </ul>
                       <b>Reglas</b>
                       <ul>
                           <li>No se permite ayuda externa.</li>
                           <li>Solo un dispositivo por equipo.</li>
                           <li>La velocidad también cuenta.</li>
                       </ul>
                       <b>Última misión</b><br><i>“Demuestren que están listos para construir el futuro.”</i><br><br>
                       <i>Al finalizar... Recibirán la bandera final.</i>`
            }
        };

        const LEVEL_COORDS = {
            1: { x: 220, y: 400 },
            2: { x: 400, y: 380 },
            3: { x: 600, y: 300 },
            4: { x: 950, y: 520 },
            5: { x: 900, y: 200 }
        };

        let gameStarted = false;
        let currentLevel = 1;
        let targetLevelForPwd = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateLevelMarkers();
            document.getElementById('btn-start').addEventListener('click', startGame);

            window.addEventListener('keydown', (e) => {
                if (!gameStarted) return;
                
                const pwdModalOpen = document.getElementById('pwd-modal').style.display === 'flex';
                const instModalOpen = document.getElementById('inst-modal').style.display === 'flex';
                
                if (pwdModalOpen || instModalOpen) {
                    if (e.key === 'Enter' && pwdModalOpen) checkPassword();
                    if (e.key === 'Escape') { closePwdModal(); closeInstModal(); }
                    return;
                }

                if (e.key === 'ArrowRight') {
                    moveTeam(1);
                } else if (e.key === 'ArrowLeft') {
                    moveTeam(-1);
                } else if (e.key === 'Enter') {
                    handleLevelClick(currentLevel);
                }
            });
        });

        function startGame() {
            gameStarted = true;
            document.getElementById('start-btn-container').style.display = 'none';
            document.getElementById('team-pawns').classList.add('visible');
            updateTeamPosition(true);
        }

        function moveTeam(direction) {
            let newLevel = currentLevel + direction;
            if (newLevel >= 1 && newLevel <= 5) {
                currentLevel = newLevel;
                updateTeamPosition();
            }
        }

        function updateTeamPosition(instant = false) {
            const el = document.getElementById('team-pawns');
            const coords = LEVEL_COORDS[currentLevel];
            
            // Lógica de túnica en la Iglesia (Nivel 3)
            // Cambiamos el color de los cuerpos (túnicas) a café, pero las cabezas se mantienen
            const tunics = document.querySelectorAll('.tunic');
            if (currentLevel === 3) {
                tunics.forEach(t => t.setAttribute('fill', '#5d4037'));
            } else {
                document.querySelector('.green-tunic').setAttribute('fill', 'var(--green-pawn)');
                document.querySelector('.blue-tunic').setAttribute('fill', 'var(--blue-pawn)');
                document.querySelector('.red-tunic').setAttribute('fill', 'var(--red-pawn)');
            }

            // Offset para centrar la base del grupo en el marcador
            const finalX = coords.x;
            const finalY = coords.y - 25;
            
            if (instant) {
                el.style.transition = 'none';
                el.setAttribute('transform', `translate(${finalX}, ${finalY})`);
                void el.offsetWidth;
                el.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            } else {
                el.setAttribute('transform', `translate(${finalX}, ${finalY - 20}) scale(1.05)`);
                setTimeout(() => {
                    el.setAttribute('transform', `translate(${finalX}, ${finalY}) scale(1)`);
                }, 200);
            }
        }

        function updateLevelMarkers() {
            for (let i = 1; i <= 5; i++) {
                const marker = document.getElementById(`lvl-${i}`);
                if (isLevelUnlocked(i)) {
                    marker.classList.add('completed');
                }
            }
        }

        function isLevelUnlocked(level) {
            if (level === 1) return true;
            return localStorage.getItem(`treasure_map_level${level}_unlocked`) === 'true';
        }

        function unlockLevel(level) {
            localStorage.setItem(`treasure_map_level${level}_unlocked`, 'true');
            updateLevelMarkers();
        }

        function handleLevelClick(level) {
            if (!gameStarted) return;
            // Opcional: mover el equipo allí si se hace click directamente
            currentLevel = level;
            updateTeamPosition();

            if (isLevelUnlocked(level)) {
                setTimeout(() => openInstModal(level), 300);
            } else {
                targetLevelForPwd = level;
                setTimeout(openPwdModal, 300);
            }
        }

        function openPwdModal() {
            const modal = document.getElementById('pwd-modal');
            const input = document.getElementById('pwd-input');
            document.getElementById('pwd-error').style.display = 'none';
            input.value = '';
            input.classList.remove('shake');
            modal.style.display = 'flex';
            setTimeout(() => input.focus(), 100);
        }

        function closePwdModal() {
            document.getElementById('pwd-modal').style.display = 'none';
            targetLevelForPwd = null;
        }

        function checkPassword() {
            const input = document.getElementById('pwd-input');
            const errorMsg = document.getElementById('pwd-error');
            const pwd = input.value.trim().toLowerCase();
            const correctPwd = LEVEL_PASSWORDS[targetLevelForPwd];

            if (pwd === correctPwd || pwd === correctPwd.toLowerCase()) {
                unlockLevel(targetLevelForPwd);
                closePwdModal();
                openInstModal(targetLevelForPwd);
            } else {
                errorMsg.style.display = 'block';
                input.classList.remove('shake');
                void input.offsetWidth;
                input.classList.add('shake');
            }
        }

        function openInstModal(level) {
            const data = LEVEL_INSTRUCTIONS[level];
            if (!data) return;

            document.getElementById('inst-title').innerHTML = data.title;
            document.getElementById('inst-text').innerHTML = data.text;
            
            const linksContainer = document.querySelector('.links-container');
            linksContainer.innerHTML = ''; // Limpiar botones anteriores
            
            if (data.links && data.links.length > 0) {
                linksContainer.style.display = 'flex';
                linksContainer.style.justifyContent = 'flex-end';
                linksContainer.style.flexWrap = 'wrap'; // Permitir múltiples filas si son muchos botones
                
                data.links.forEach(linkObj => {
                    const btn = document.createElement('a');
                    btn.className = 'pirate-btn link-btn';
                    btn.target = '_blank';
                    btn.href = linkObj.url;
                    btn.innerText = linkObj.label;
                    btn.style.margin = '5px 0 5px 10px';
                    linksContainer.appendChild(btn);
                });
            } else {
                linksContainer.style.display = 'none';
            }

            document.getElementById('inst-modal').style.display = 'flex';
        }

        function closeInstModal() {
            document.getElementById('inst-modal').style.display = 'none';
            window.focus();
        }
    </script>
</body>
</html>
